filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/channel/*.log
    fields:
      server_type: channel
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
