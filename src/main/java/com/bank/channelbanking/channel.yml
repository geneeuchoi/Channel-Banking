apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: channel
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: channel-service
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: channel-service
spec:
  selector:
    app: channel
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort
---
apiVersion: v1
kind: Secret
metadata:
  name: core-secret
stringData:
  jwt-secret-key: "MtM1b38H762XFclV+Rhjr+4QiRym1bSoCHzdGnH03mE="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: channel
  template:
    metadata:
      labels:
        app: channel
    spec:
      containers:
        - name: channel-container
          image: 381491932103.dkr.ecr.ap-northeast-2.amazonaws.com/channel
          ports:
            - containerPort: 8080
          env:
            - name: JWE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spring-secret
                  key: jwt-secret-key